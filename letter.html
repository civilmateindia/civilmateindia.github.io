<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Civil Mate – Letter Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{--bg:#eceff3;--cd:#fff;--tx:#1c1f24;--mu:#6b7280;--bd:#d9dde3;--ac:#1a56db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--cd:#202327;--tx:#e8eaed;--mu:#9aa0a8;--bd:#363a40;--ac:#6ea0ff}}
:root[data-theme="dark"]{--bg:#15171a;--cd:#202327;--tx:#e8eaed;--mu:#9aa0a8;--bd:#363a40;--ac:#6ea0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--cd);border-bottom:1px solid var(--bd);align-items:center;position:sticky;top:0;z-index:20}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
button{cursor:pointer}button.p,button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#blocks{padding:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:780px;margin:auto}
.c{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:8px;padding:8px}
.c.off{opacity:.55;border-left-color:var(--bd)}
.c.hid{opacity:.6;border-left-color:var(--mu)}.c.hid .ch b::after{content:' · not printed';color:var(--mu);font-weight:400}
.c.addc{position:sticky;bottom:8px;z-index:3;opacity:1;box-shadow:0 2px 10px #0003;border-left-color:var(--ac)}
.ch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}.ch b{flex:1 1 160px;min-width:0;font-size:14px}
.ch button{padding:5px 11px}
.c label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.c textarea{min-height:44px}.c input,.c select{min-height:38px}
@media (max-width:700px),(max-height:650px){.bar,.c.addc{position:static}}
.fs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}.f{min-width:0}.f.w{grid-column:1/-1}
input[type=checkbox]{padding:0;width:auto}
@media (max-width:600px){select,input,textarea{font-size:16px}.bar{gap:4px;padding:6px}}
.c input,.c textarea,.c select{width:100%}
textarea{resize:none;overflow:hidden;line-height:1.4}
.kw{margin-top:4px;background:#fffdf5;color:#000;border:1px dashed #c9b97a;border-radius:6px;padding:4px 8px}
.kpl{font-size:10px;color:#7a6a20}
.kp{font:13pt/1.4 'Noto Sans Devanagari','Mangal',serif;white-space:pre-wrap}
.kp.k{font:16pt/1.3 'Kruti Dev 010','Kruti Dev 010 Regular','Kruti Dev',serif}
.note{font-size:12px;color:var(--mu);padding:6px 10px;max-width:780px;margin:auto}
.note.w{color:#b45309}
#wrap{padding:10px;overflow:auto}
#pages{width:max-content;margin:auto;transform-origin:top}
.pg{background:#fff;color:#000;margin:0 auto 14px;box-shadow:0 2px 12px #0004;padding:16mm 18mm 12mm;display:flex;flex-direction:column;overflow:hidden;font:12pt/1.45 'Times New Roman',serif}
#pages.hi .pg{font-family:'Noto Sans Devanagari','Mangal',serif;font-size:11pt}
#pages.kd .pg{font-family:'Kruti Dev 010','Kruti Dev 010 Regular','Kruti Dev',serif;font-size:15pt;line-height:1.3}
.bd{flex:1;min-height:0;overflow:hidden}.bd>*{margin:0 0 6px}
.hd{border-bottom:2px solid #000;padding-bottom:5px;margin-bottom:8px}.hd .tx{text-align:center;font-weight:700}.hf{display:flex;align-items:center;gap:8px}.hf .tx{flex:1;text-align:center}.hf img{flex:none}.ic img{display:block;margin:0 auto}.hd img,.ft img{object-fit:contain}
.ft{border-top:1px solid #000;padding-top:5px;text-align:center;font-size:10pt}
.pn{text-align:right;font-size:9pt}
/* one indent column (--x) drives everything */
.g{display:grid;grid-template-columns:var(--x) 1fr}
.row{display:flex;justify-content:space-between;gap:10px;padding-left:var(--x)}
.p{text-align:justify;text-indent:var(--x)}
.ind{padding-left:var(--x)}
.li{padding-left:7mm;text-indent:-7mm}
.lt{display:flex;text-align:justify}.lm{display:flex;margin:0 0 3px -8mm}.lm .mk{flex:none;width:8mm}.lm .lx{flex:1;min-width:0}.bd>.lt{margin-bottom:3px}.mk{flex:none}.lx{flex:1;min-width:0}
.sg{margin-left:auto;width:max-content;max-width:75%;text-align:left;line-height:1.2}.cp{line-height:1.2}.cp .li{margin-bottom:3px}
table{border-collapse:collapse;width:100%;table-layout:fixed}td,th{border:1px solid #000;padding:3px 6px;text-align:left;vertical-align:top;overflow-wrap:break-word}
tr{break-inside:avoid}
.bar #fmt{display:flex;gap:4px}.bar #fmt button{min-width:34px;padding:6px}
sup,sub{line-height:0;font-size:.7em}
.h{display:block;font-weight:700;text-indent:0;line-height:1.25;margin:2px 0}.h1{font-size:1.35em}.h2{font-size:1.22em}.h3{font-size:1.1em}.h4{font-size:1em}.h5{font-size:1em;font-style:italic}.h6{font-size:.95em;font-style:italic;font-weight:600}
.un{background:#fdd;outline:1px solid #d33}
.en{font-family:'Times New Roman',Times,serif;font-size:12pt;line-height:1}.kp.k .en{font-size:13pt}
@media print{body{background:#fff}.bar,#blocks,.note,.noprint{display:none!important}
#wrap{display:block!important;padding:0;overflow:visible}#pages{zoom:1!important;width:auto}
.pg{margin:0;box-shadow:none;break-after:page}.pg:last-child{break-after:auto}}
</style><style id="ui2">
@media screen{
:root{--bg:#f1f3f7;--cd:#fff;--tx:#1b2330;--mu:#6b7686;--bd:#dfe3ea;--ac:#2557d6;--r:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151a;--cd:#1c2027;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2f3640;--ac:#6f9bff}}
:root[data-theme="dark"]{--bg:#12151a;--cd:#1c2027;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2f3640;--ac:#6f9bff}
body{font:15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button{border-radius:8px}
.bar{display:block;padding:0;background:var(--cd);border-bottom:1px solid var(--bd);box-shadow:0 1px 6px #0001;position:sticky;top:0;z-index:20}
.bt{display:flex;align-items:center;gap:8px;padding:8px 10px}
.brand{font-size:15px;white-space:nowrap}
.seg{display:flex;flex:1;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:8px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--cd);color:var(--ac);box-shadow:0 1px 4px #0002}
.tools{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:10px 12px 4px;max-width:1500px;margin:0 auto}
.tools label,.drawer label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu)}
.drawer{display:none;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:6px 12px;padding:10px;border:1px solid var(--bd);border-radius:var(--r);background:var(--cd)}
.drawer.open{display:flex}
.drawer #aul{flex-direction:row;align-items:center}
.fmtbar{display:flex;gap:6px;padding:6px 12px;background:var(--bg);overflow-x:auto;position:sticky;top:56px;z-index:15}
.fmtbar button{min-width:40px;padding:7px 8px}
#app{max-width:1500px;margin:0 auto}
#blocks{padding:6px 12px 90px;gap:10px}
.c{border-radius:var(--r);box-shadow:0 1px 3px #0001;border-left-width:5px;border-left-color:var(--cc,var(--ac));padding:8px 12px 12px}
.c:focus-within{box-shadow:0 0 0 2px var(--ac)}
.ch{flex-wrap:nowrap;gap:4px;margin:0}
.ch b{flex:1;min-width:0;font-size:14px}
.ch .ti{flex:1;text-align:left;border:0;background:transparent;font-weight:700;font-size:14px;padding:8px 4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .ac{display:flex;gap:2px;flex:none}
.ch .ib{width:36px;height:36px;padding:0;border:0;background:transparent;font-size:16px;color:var(--mu)}
.ch .ib:hover{background:var(--bg)}
.dh{cursor:grab;color:var(--mu);padding:0 2px;user-select:none;align-self:center}
.sm{color:var(--mu);font-size:13px;padding:0 6px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs{margin-top:4px}
.addb{border:2px dashed var(--bd);background:transparent;border-radius:var(--r);padding:14px;font-weight:600;color:var(--ac);font-size:15px}
#wrap{background:var(--bg)}
#ap{display:none;position:fixed;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;background:var(--cd);border-top:1px solid var(--bd);box-shadow:0 -6px 24px #0003;padding:14px;z-index:40;border-radius:16px 16px 0 0}
#ap.open{display:block}
#ap .chh{display:flex;justify-content:space-between;align-items:center}
#ap h4{margin:12px 0 6px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
#ap .chips{display:flex;flex-wrap:wrap;gap:8px}
#ap .chips button{padding:10px 14px;border-radius:999px}
@media (max-height:599px){.fmtbar{position:static}}
@media (min-width:1000px){
 .seg{display:none}.bt{justify-content:space-between}
 #app{display:grid;grid-template-columns:minmax(420px,560px) 1fr;align-items:start}
 #ed{max-height:calc(100vh - 58px);overflow:auto;position:sticky;top:56px}
 .fmtbar{top:0}
 #wrap{display:block!important;position:sticky;top:56px;max-height:calc(100vh - 58px);overflow:auto}
}
}
@media print{#ed,#ap,.tools,.drawer,.bar{display:none!important}#app{display:block!important}}
</style>

@media screen{
:root,:root[data-theme="light"]{--bg:#fdfcff;--cd:#fff;--tx:#1f1f1f;--mu:#5f6368;--bd:#e0e2e5;--ac:#0b57d0;--primary:#0b57d0;--primary-container:#d3e3fd;--surface:#f0f4f9;--outline:#747775;--danger:#d93025;--warning:#ea8600;--r:12px;color-scheme:light}

.material-icons{vertical-align:middle;font-size:20px}

::placeholder{color:#9aa0a6;opacity:1}

button:hover{background:#d3e3fd}
button.p{background:var(--primary);color:#fff}button.p:hover{background:#0842a0;box-shadow:0 2px 4px rgba(11,87,208,.2)}
.bar{padding:0 16px;background:#fff;border-bottom:1px solid var(--bd);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.header-top h1{font-size:18px;font-weight:700;margin:0;color:var(--primary);display:flex;align-items:center;gap:8px}
.seg{display:flex;gap:16px;overflow-x:auto;background:none;padding:0;border-radius:0;flex:none}
.seg button{flex:none;background:none;border:none;border-bottom:3px solid transparent;border-radius:0;padding:12px 4px;font-weight:500;color:var(--mu);box-shadow:none}
.seg button:hover{color:var(--tx);background:none}
.seg button.on{background:none;color:var(--primary);border-bottom-color:var(--primary);box-shadow:none}
.tools,.drawer{background:#fff;border:1px solid var(--bd);border-radius:var(--r);margin:12px 16px 0;padding:12px;max-width:none}
.drawer{margin-top:8px}
.tools label,.drawer label{font-weight:500;color:var(--mu)}
.fmtbar{background:var(--bg);padding:8px 16px}
.fmtbar button{background:#e8f0fe;min-width:38px;padding:6px 8px}
#blocks{padding:8px 16px 90px}
.note{padding:6px 16px;color:var(--mu)}
.note.w{background:#fef7e0;color:#b06000;border:1px solid #fce8b2;border-radius:6px;margin:8px 16px;padding:8px 12px;font-weight:500}
.c{background:#f8f9fa;border:1px solid var(--bd);border-left:4px solid var(--cc,var(--primary));border-radius:8px;box-shadow:none;padding:6px 12px 12px}

.c.off{opacity:.6}
.c.hid .ti::after{content:' · not printed';color:var(--mu);font-weight:400}
.it-num{background:var(--primary-container);color:var(--primary);font-weight:700;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;flex:none}
.ch .ti{font-weight:600;color:var(--tx);background:none;font-size:14px;justify-content:flex-start;gap:2px}
.ch .ti:hover{background:none;color:var(--primary)}

.ch .ib:hover{background:#e8f0fe;color:var(--primary)}
.ch .ib .material-icons,.dh .material-icons{font-size:20px}
.dh{color:var(--mu);display:flex}
.c label{font-weight:500;color:var(--mu)}
.sm{color:var(--mu)}
.addb{border:2px dashed #c2c7cf;background:#f8f9fa;color:var(--primary);border-radius:8px;padding:14px;font-weight:600;font-size:14px}
.addb:hover{background:#e8f0fe;border-color:var(--primary)}
.kw{background:#fef7e0;border:1px dashed #fce8b2;border-radius:6px}
.kpl{color:#b06000}

<header class="bar noprint"><div class="header-top">
<h1><span class="material-icons">drafts</span> Letter Builder <small id="ver" style="font-weight:400;color:#5f6368;font-size:11px">v12</small></h1>
<div style="display:flex;align-items:center;gap:8px">
<a href="index.html" style="text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;color:var(--mu);padding:6px 12px;border-radius:6px;border:1px solid var(--bd);background:#fff;"><span class="material-icons" style="font-size:16px">arrow_back</span> CivilMate Home</a>
<button class="p" id="prn"><span class="material-icons">print</span> Print</button></div></div>
<nav class="seg"><button id="t1" class="on">Write</button><button id="t2">Pages <small id="pc"></small></button></nav></header>
<div class="tools noprint">
<label>Language<select id="lang"><option value="en">English</option><option value="hi">हिन्दी</option></select></label>
<label>Paper<select id="paper"><option value="a4">A4</option><option value="legal">Legal</option></select></label>
<button id="sg"><span class="material-icons">tune</span> More options</button>
</div>
<div class="drawer noprint" id="dr">
<label>Indent (mm)<input id="ind" type="number" min="10" max="45"></label>
<label id="aul" style="display:none"><input type="checkbox" id="aut" checked> Auto English</label>
<button id="cx">Collapse all</button>
</div>
<div id="app"><div id="ed">
<div id="fmt" class="fmtbar noprint" title="Select text in a field, then tap"><button data-h="1" title="Heading level of the current line (tap again for the next level)">H</button><button data-w="**|**"><b>B</b></button><button data-w="*|*"><i>I</i></button><button data-w="++|++"><u>U</u></button><button data-w="~~|~~"><s>S</s></button><button data-w="^{|}">x²</button><button data-w="_{|}">x₂</button></div>
<div class="note noprint" id="fnote" style="display:none"></div>
<div class="note noprint" id="mdn">Formatting: **bold** · *italic* · ++underline++ · ~~strike~~ · m^{2} · H_{2}O · use \* to type a literal * · # … ###### at the start of a line = headings</div>

})();
